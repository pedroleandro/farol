services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: farol_app
    ports:
      - "127.0.0.1:8010:80"
    volumes:
      - .:/var/www/html/farol
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: mysql:8.0
    container_name: farol_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: farol
    volumes:
      - farol_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  farol_db_data: